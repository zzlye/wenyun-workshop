<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="文运工坊" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa-icon.svg" />
    <link rel="icon" href="./pwa-icon.svg" type="image/svg+xml" />
    <title>文运工坊</title>
    <script>
      ;(function () {
        try {
          // 清理旧版离线缓存，避免旧 index.html 指向已经不存在的 hash 资源导致白屏。
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (registrations) {
                registrations.forEach(function (registration) {
                  registration.unregister()
                })
              })
              .catch(function () {})
          }

          if ('caches' in window) {
            caches.keys()
              .then(function (keys) {
                keys.forEach(function (key) {
                  if (/gpt-image-playground|wenyun-workshop|workbox|vite/i.test(key)) {
                    caches.delete(key)
                  }
                })
              })
              .catch(function () {})
          }
        } catch (error) {}
      })()
    </script>
    <script>
      ;(function () {
        try {
          // 如果主程序没有正常挂载，提供一个只清应用壳缓存的入口，不影响画布和素材数据。
          window.setTimeout(function () {
            var root = document.getElementById('root')
            if (!root || root.childElementCount > 0) return

            var wrapper = document.createElement('main')
            wrapper.style.cssText = 'min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#111827;font-family:Microsoft YaHei,PingFang SC,system-ui,sans-serif;padding:24px;box-sizing:border-box;'
            wrapper.innerHTML = '<section style="width:min(420px,100%);padding:28px;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 18px 60px rgba(15,23,42,.14);text-align:center;"><h1 style="margin:0 0 12px;font-size:22px;">文运工坊加载异常</h1><p style="margin:0;color:#4b5563;line-height:1.7;">可能是浏览器保存了旧版页面缓存。点击修复只会清理应用壳缓存，不会删除画布、图片和素材。</p><button id="wenyun-cache-reset" type="button" style="margin-top:22px;height:40px;padding:0 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer;">修复后重新进入</button></section>'
            document.body.innerHTML = ''
            document.body.appendChild(wrapper)
            document.getElementById('wenyun-cache-reset').addEventListener('click', function () {
              window.location.href = '/cache-reset.html?from=boot&ts=' + Date.now()
            })
          }, 3500)
        } catch (error) {}
      })()
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
