<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="文运工坊" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa-icon.svg" />
    <link rel="icon" href="./pwa-icon.svg" type="image/svg+xml" />
    <title>文运工坊</title>
    <script>
      ;(function () {
        try {
          // 清理旧版离线缓存，避免旧 index.html 指向已经不存在的 hash 资源导致白屏。
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (registrations) {
                registrations.forEach(function (registration) {
                  registration.unregister()
                })
              })
              .catch(function () {})
          }

          if ('caches' in window) {
            caches.keys()
              .then(function (keys) {
                keys.forEach(function (key) {
                  if (/gpt-image-playground|wenyun-workshop|workbox|vite/i.test(key)) {
                    caches.delete(key)
                  }
                })
              })
              .catch(function () {})
          }
        } catch (error) {}
      })()
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
