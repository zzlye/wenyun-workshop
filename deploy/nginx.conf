server {
    listen ${HOST}:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;
    add_header Referrer-Policy "unsafe-url" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源长缓存（Vite 生成的带 hash 文件名）
    location ~ ^/assets/.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /missing-asset-recover.js;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 公开只读代理：用于系统公告和随机背景元数据，避免浏览器 CORS 拦截。
    location /wy-public/wenyun/ {
        limit_except GET OPTIONS {
            deny all;
        }

        proxy_pass https://zzlye.xyz:60/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name zzlye.xyz;
        proxy_set_header Host zzlye.xyz:60;
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    location /wy-public/mukyu/ {
        limit_except GET OPTIONS {
            deny all;
        }

        proxy_pass https://i.mukyu.ru/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name i.mukyu.ru;
        proxy_set_header Host i.mukyu.ru;
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    # NewAPI 模型广场成功率只读代理：只允许 summary 接口，凭证仅在服务端注入，避免暴露给浏览器。
    location = /model-performance-proxy/wenyun/api/perf-metrics/summary {
        limit_except GET {
            deny all;
        }

        set $newapi_wenyun_access_token "${NEWAPI_WENYUN_ACCESS_TOKEN}";
        set $newapi_wenyun_user_id "${NEWAPI_WENYUN_USER_ID}";

        if ($newapi_wenyun_access_token = "") {
            return 503 "Missing NEWAPI_WENYUN_ACCESS_TOKEN";
        }

        if ($newapi_wenyun_user_id = "") {
            return 503 "Missing NEWAPI_WENYUN_USER_ID";
        }

        proxy_pass https://zzlye.xyz:60/api/perf-metrics/summary;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name zzlye.xyz;
        proxy_set_header Host zzlye.xyz:60;
        proxy_set_header Authorization "Bearer $newapi_wenyun_access_token";
        proxy_set_header New-Api-User "$newapi_wenyun_user_id";
        proxy_set_header Cache-Control "no-cache";
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    location = /model-performance-proxy/public/api/perf-metrics/summary {
        limit_except GET {
            deny all;
        }

        set $newapi_public_access_token "${NEWAPI_PUBLIC_ACCESS_TOKEN}";
        set $newapi_public_user_id "${NEWAPI_PUBLIC_USER_ID}";

        if ($newapi_public_access_token = "") {
            return 503 "Missing NEWAPI_PUBLIC_ACCESS_TOKEN";
        }

        if ($newapi_public_user_id = "") {
            return 503 "Missing NEWAPI_PUBLIC_USER_ID";
        }

        proxy_pass https://1520635.xyz:3901/api/perf-metrics/summary;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name 1520635.xyz;
        proxy_set_header Host 1520635.xyz:3901;
        proxy_set_header Authorization "Bearer $newapi_public_access_token";
        proxy_set_header New-Api-User "$newapi_public_user_id";
        proxy_set_header Cache-Control "no-cache";
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    # NewAPI 模型价格只读代理：价格页可能要求前台登录态，凭证仅在服务端注入。
    location = /model-pricing-proxy/wenyun/api/pricing {
        limit_except GET {
            deny all;
        }

        set $newapi_wenyun_access_token "${NEWAPI_WENYUN_ACCESS_TOKEN}";
        set $newapi_wenyun_user_id "${NEWAPI_WENYUN_USER_ID}";

        if ($newapi_wenyun_access_token = "") {
            return 503 "Missing NEWAPI_WENYUN_ACCESS_TOKEN";
        }

        if ($newapi_wenyun_user_id = "") {
            return 503 "Missing NEWAPI_WENYUN_USER_ID";
        }

        proxy_pass https://zzlye.xyz:60/api/pricing;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name zzlye.xyz;
        proxy_set_header Host zzlye.xyz:60;
        proxy_set_header Authorization "Bearer $newapi_wenyun_access_token";
        proxy_set_header New-Api-User "$newapi_wenyun_user_id";
        proxy_set_header Cache-Control "no-cache";
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    location = /model-pricing-proxy/public/api/pricing {
        limit_except GET {
            deny all;
        }

        set $newapi_public_access_token "${NEWAPI_PUBLIC_ACCESS_TOKEN}";
        set $newapi_public_user_id "${NEWAPI_PUBLIC_USER_ID}";

        if ($newapi_public_access_token = "") {
            return 503 "Missing NEWAPI_PUBLIC_ACCESS_TOKEN";
        }

        if ($newapi_public_user_id = "") {
            return 503 "Missing NEWAPI_PUBLIC_USER_ID";
        }

        proxy_pass https://1520635.xyz:3901/api/pricing;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name 1520635.xyz;
        proxy_set_header Host 1520635.xyz:3901;
        proxy_set_header Authorization "Bearer $newapi_public_access_token";
        proxy_set_header New-Api-User "$newapi_public_user_id";
        proxy_set_header Cache-Control "no-cache";
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_buffering off;
    }

    # 内置图片 API 代理：两个固定站点各走自己的 /v1，避免文运站和公益站互相串线。
    location /api-proxy/wenyun/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass https://zzlye.xyz:60/v1/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name zzlye.xyz;
        proxy_set_header Host zzlye.xyz:60;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api-proxy/public/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        proxy_pass https://1520635.xyz:3901/v1/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name 1520635.xyz;
        proxy_set_header Host 1520635.xyz:3901;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # NewAPI 根路径代理：余额、公告、价格接口不在 /v1 下，必须单独转发根路径。
    location /newapi-proxy/wenyun/ {
        limit_except GET POST DELETE OPTIONS {
            deny all;
        }

        proxy_pass https://zzlye.xyz:60/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name zzlye.xyz;
        proxy_set_header Host zzlye.xyz:60;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /newapi-proxy/public/ {
        limit_except GET POST DELETE OPTIONS {
            deny all;
        }

        proxy_pass https://1520635.xyz:3901/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name 1520635.xyz;
        proxy_set_header Host 1520635.xyz:3901;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 通用图片代理：新版本优先用路径式 /asset-proxy/https/host/path，旧 ?url= 继续兼容。
    location ~ ^/asset-proxy/(https?)/([^/]+)(/.*)?$ {
        limit_except GET OPTIONS {
            deny all;
        }

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 10s;
        set $asset_proxy_scheme $1;
        set $asset_proxy_host $2;
        set $asset_proxy_path $3;
        if ($asset_proxy_path = "") {
            set $asset_proxy_path "/";
        }

        set $asset_proxy_ssl_name $asset_proxy_host;
        if ($asset_proxy_ssl_name ~ "^(.+):\d+$") {
            set $asset_proxy_ssl_name $1;
        }

        proxy_pass $asset_proxy_scheme://$asset_proxy_host$asset_proxy_path$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $asset_proxy_ssl_name;
        proxy_set_header Host $asset_proxy_host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /asset-proxy {
        limit_except GET OPTIONS {
            deny all;
        }

        if ($arg_url = "") {
            return 400 "Missing url";
        }

        if ($arg_url !~* "^https?://") {
            return 400 "Invalid url";
        }

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 10s;
        proxy_pass $arg_url;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # BEGIN API PROXY
    # API 代理。前端请求同源 /api-proxy/...，由 Nginx 转发到部署时配置的 API_PROXY_URL。
    location /api-proxy/ {
        limit_except GET POST OPTIONS {
            deny all;
        }

        if ($uri = "/api-proxy/") {
            return 403 "Forbidden: API Proxy path required";
        }

        proxy_pass ${API_PROXY_URL}/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    # END API PROXY

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
