<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>文运工坊缓存修复</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #111827;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.14);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: #4b5563;
      }

      button {
        margin-top: 22px;
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #020617;
          color: #f8fafc;
        }

        main {
          background: rgba(15, 23, 42, 0.94);
          box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在修复缓存</h1>
      <p id="status">正在清理旧版应用壳缓存，不会删除画布、图片和素材。</p>
      <button id="retry" type="button" hidden>重新进入</button>
    </main>
    <script>
      ;(function () {
        var statusEl = document.getElementById('status')
        var retryEl = document.getElementById('retry')

        function setStatus(text) {
          statusEl.textContent = text
        }

        function clearCaches() {
          if (!('caches' in window)) return Promise.resolve()
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) {
              return caches.delete(key)
            }))
          })
        }

        function unregisterWorkers() {
          if (!('serviceWorker' in navigator)) return Promise.resolve()
          return navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister()
            }))
          })
        }

        function goHome() {
          var url = new URL('/', window.location.origin)
          url.searchParams.set('cache_reset', String(Date.now()))
          window.location.replace(url.toString())
        }

        retryEl.addEventListener('click', goHome)

        Promise.all([clearCaches(), unregisterWorkers()])
          .then(function () {
            setStatus('缓存修复完成，正在重新进入文运工坊。')
            goHome()
          })
          .catch(function () {
            setStatus('自动修复失败，请点击按钮重新进入。')
            retryEl.hidden = false
          })
      })()
    </script>
  </body>
</html>
